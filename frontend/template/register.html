<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Healthcare Unified System</title>
  <link rel="stylesheet" href="/static/register.css">
</head>
<body>
  <div class="container">
    <h1>Create Account</h1>
    <form id="registerForm">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>
      </div>
      <div class="form-group">
        <label for="country">Country</label>
        <input type="text" id="country" name="country" placeholder="Enter your country" required>
      </div>
      <div class="form-group checkbox-group">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and Conditions</label>
      </div>
      <button type="submit" class="button">REGISTER</button>
    </form>
    <p class="login-link">
      Already have an account? <a href="/login.html">Login here</a>
    </p>
    <div id="message" class="message"></div>
  </div>
  <footer>
    <p>
      &copy; <span id="year"></span> Healthcare Unified System. All Rights Reserved
    </p>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      // Handle registration form submission
      document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fullName = document.getElementById('full_name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const country = document.getElementById('country').value;
        const terms = document.getElementById('terms').checked;
        const messageDiv = document.getElementById('message');
        
        if (!terms) {
          messageDiv.style.color = 'red';
          messageDiv.textContent = 'You must agree to the Terms and Conditions';
          return;
        }
        
        try {
          const response = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ full_name: fullName, email, password, country })
          });
          
          const data = await response.json();
          
          if (response.ok) {
            messageDiv.style.color = 'green';
            messageDiv.textContent = 'Registration successful! Redirecting to login...';
            // Redirect to login page after successful registration
            setTimeout(() => {
              window.location.href = '/login.html';
            }, 1500);
          } else {
            messageDiv.style.color = 'red';
            messageDiv.textContent = data.error || 'Registration failed';
          }
        } catch (error) {
          messageDiv.style.color = 'red';
          messageDiv.textContent = 'Network error. Please try again.';
        }
      });
    </script>
  </footer>
</body>
</html>
